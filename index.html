<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>HELLO 앙쥬🤍 BOY or GIRL?</title>
<style>
  :root{--bg:#08090d;--card:#14161d;--text:#f7f7fb;--muted:#c2c5d0;--pink:#ff8fba;--pink2:#4a2536;--blue:#79b6ff;--blue2:#203b5b;--shadow:0 20px 60px rgba(0,0,0,.48)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;background:radial-gradient(circle at 18% 5%,#25202b 0,transparent 34%),radial-gradient(circle at 85% 92%,#142943 0,transparent 36%),linear-gradient(180deg,#08090d,#0d1017);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .app{width:min(560px,100%);background:rgba(20,22,29,.92);backdrop-filter:blur(14px);border-radius:28px;box-shadow:var(--shadow);padding:24px;border:1px solid rgba(255,255,255,.1)}
  h1{font-size:clamp(30px,8vw,54px);line-height:1.03;margin:6px 0 8px;text-align:center;letter-spacing:-.04em}
  .subtitle{text-align:center;color:var(--muted);margin-bottom:22px;font-weight:700}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  .cell{aspect-ratio:1;border:1px solid rgba(255,255,255,.09);border-radius:20px;background:#1b1e27;box-shadow:0 10px 25px rgba(0,0,0,.34);font-size:42px;cursor:pointer;position:relative;overflow:hidden;transition:.18s transform,.18s box-shadow,.18s background}
  .cell:active{transform:scale(.97)}
  .cell.open{box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 10px 25px rgba(0,0,0,.3)}
  .cell .cover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#242731,#171920);transition:.32s opacity,.32s transform}
  .cell .cover svg{width:min(62%,72px);height:auto;filter:drop-shadow(0 7px 8px rgba(74,76,100,.14));transition:.2s transform}
  .cell:hover .cover svg{transform:translateY(-3px) rotate(-2deg)}
  .cell.open .cover{opacity:0;transform:scale(1.35) rotate(6deg);pointer-events:none}
  .cell .tile-label{display:block;margin-top:2px;font-size:13px;font-weight:1000;letter-spacing:.08em}
  .cell.win{animation:pulse .7s ease-in-out infinite alternate}
  @keyframes pulse{to{transform:scale(1.04);box-shadow:0 0 0 6px rgba(255,255,255,.8),0 0 28px rgba(0,0,0,.12)}}
  .controls{display:flex;gap:10px;justify-content:center}
  .btn{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;background:#222;color:#fff}
  .status{text-align:center;font-weight:800;color:#e1e3ea;min-height:24px}
  .reveal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(4,5,8,.68);backdrop-filter:blur(8px)}
  .reveal.show{display:flex}
  .reveal-card{text-align:center;padding:40px 28px;border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.55);background:#151821;border:1px solid rgba(255,255,255,.12);animation:pop .45s cubic-bezier(.2,.9,.2,1.2)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .reveal-word{font-size:clamp(72px,22vw,150px);font-weight:1000;letter-spacing:-.06em;line-height:.9}
  .girlText{color:#f05b98}.boyText{color:#4f9df8}
  .reveal small{display:block;margin-top:16px;font-weight:900;color:#f0f1f5;font-size:18px}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
  .hint{font-size:13px;color:#afb3c0;text-align:center;margin-top:12px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">
  <h1>HELLO 앙쥬🤍<br>BOY or GIRL?</h1>
  <div class="subtitle">하나씩 열어서 3칸을 한 줄로 맞춰보세요!</div>

  <div class="status" id="status">리본을 하나씩 열어보세요.</div>
  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn" id="resetBtn">다시하기</button>
  </div>
  <div class="hint">각 칸을 터치하면 리본이 공개됩니다.</div>
</div>

<div class="reveal" id="reveal" role="dialog" aria-modal="true">
  <div class="reveal-card">
    <div class="reveal-word boyText" id="revealWord">BOY</div>
    <small>축하합니다 🤍</small>
  </div>
</div>

<script>
// Google Analytics 4: replace this value with your own Measurement ID.
const GA_MEASUREMENT_ID = 'G-SES4FZJZTY';
const analyticsEnabled = /^G-[A-Z0-9]+$/.test(GA_MEASUREMENT_ID)
  && GA_MEASUREMENT_ID !== 'G-XXXXXXXXXX'
  && location.hostname === 'ilju0423.github.io';

function initAnalytics(){
  if(!analyticsEnabled) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', GA_MEASUREMENT_ID, {anonymize_ip:true});
  const script = document.createElement('script');
  script.async = true;
  script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(GA_MEASUREMENT_ID)}`;
  document.head.appendChild(script);
}

function trackEvent(name, params={}){
  if(analyticsEnabled && typeof window.gtag === 'function') gtag('event', name, params);
}

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const revealEl = document.getElementById('reveal');
const revealWord = document.getElementById('revealWord');
let opened = Array(9).fill(false);
let finished = false;
let tiles = [];
let winningLine = [];
let gameStarted = false;
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function makeBoard(){
  // Pick one of the eight possible bingo lines, then choose a layout where
  // that is the only all-BOY line and no all-GIRL line exists.
  const targetIndex = Math.floor(Math.random()*wins.length);
  const valid = [];
  for(let mask=0;mask<512;mask++){
    const candidate = Array.from({length:9},(_,i)=>(mask>>i&1)?'boy':'girl');
    const boyLines = wins.map((line,i)=>line.every(n=>candidate[n]==='boy')?i:-1).filter(i=>i>=0);
    const hasGirlLine = wins.some(line=>line.every(n=>candidate[n]==='girl'));
    if(boyLines.length===1 && boyLines[0]===targetIndex && !hasGirlLine) valid.push(candidate);
  }
  tiles = valid[Math.floor(Math.random()*valid.length)];
  winningLine = wins[targetIndex];
}

function ribbonSVG(color){
  return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 55S8 41 8 23c0-8 6-14 14-14 5 0 9 2 12 7 3-5 7-7 12-7 8 0 14 6 14 14 0 18-24 32-28 32Z" fill="${color}"/>
    <path d="M18 18c3-4 8-5 12-1" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".58"/>
    <circle cx="19" cy="26" r="2.5" fill="#fff" opacity=".38"/>
  </svg>`;
}

function giftSVG(){
  return `<svg viewBox="0 0 88 88" aria-hidden="true">
    <defs>
      <linearGradient id="giftBox" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff1f7"/><stop offset="1" stop-color="#dcecff"/>
      </linearGradient>
    </defs>
    <path d="M14 37h60v39a6 6 0 0 1-6 6H20a6 6 0 0 1-6-6V37Z" fill="url(#giftBox)" stroke="#d8d8e5" stroke-width="2"/>
    <path d="M9 29a5 5 0 0 1 5-5h60a5 5 0 0 1 5 5v13H9V29Z" fill="#fff" stroke="#d8d8e5" stroke-width="2"/>
    <path d="M39 24h10v58H39z" fill="#83b9ff"/><path d="M9 32h70v10H9z" fill="#f6a8c4" opacity=".9"/>
    <path d="M44 24C34 22 27 18 28 12c1-5 7-7 11-4 4 3 5 10 5 16Z" fill="#f6a8c4" stroke="#e58cad" stroke-width="2"/>
    <path d="M44 24c10-2 17-6 16-12-1-5-7-7-11-4-4 3-5 10-5 16Z" fill="#83b9ff" stroke="#6ba5ed" stroke-width="2"/>
    <circle cx="44" cy="25" r="6" fill="#fff" stroke="#d8d8e5" stroke-width="2"/>
    <path d="M25 55h7M57 62h7M26 70h5" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  </svg>`;
}

function render(){
  boardEl.innerHTML='';
  opened.forEach((isOpen,i)=>{
    const btn=document.createElement('button');
    btn.className='cell'+(isOpen?' open':'');
    const type = tiles[i];
    const isGirl = type==='girl';
    const color = isGirl ? '#f48ab3' : '#69aaf7';
    btn.style.background = isOpen ? (isGirl?'#3a202d':'#1d344f') : '#1b1e27';
    btn.setAttribute('aria-label',isOpen ? type.toUpperCase() : `${i+1}번 칸 열기`);
    btn.innerHTML = ribbonSVG(color)+`<span class="tile-label ${isGirl?'girlText':'boyText'}">${type.toUpperCase()}</span><div class="cover">${giftSVG()}</div>`;
    btn.addEventListener('click',()=>openCell(i));
    boardEl.appendChild(btn);
  });
}

function openCell(i){
  if(finished || opened[i]) return;
  if(!gameStarted){
    gameStarted=true;
    trackEvent('game_start');
  }
  opened[i]=true;
  trackEvent('tile_open', {tile_number:i+1, tile_result:tiles[i], opened_count:opened.filter(Boolean).length});
  render();
  if(winningLine.every(idx=>opened[idx])){
    finished=true;
    [...boardEl.children].forEach((el,idx)=>{if(winningLine.includes(idx))el.classList.add('win')});
    statusEl.textContent='BOY BINGO!';
    trackEvent('game_complete', {result:'boy', opened_count:opened.filter(Boolean).length});
    setTimeout(()=>showReveal(),350);
  } else {
    const n=opened.filter(Boolean).length;
    statusEl.textContent=`${n}/9 칸을 열었습니다.`;
  }
}

function showReveal(){
  revealWord.textContent='BOY';
  revealWord.className='reveal-word boyText';
  revealEl.classList.add('show');
  confettiBurst(['#5da9ff','#a9d2ff','#ffffff','#d7ebff']);
}

function reset(isRestart=false){
  if(isRestart) trackEvent('game_restart', {previously_started:gameStarted});
  opened=Array(9).fill(false);finished=false;revealEl.classList.remove('show');
  gameStarted=false;
  makeBoard();
  statusEl.textContent='리본을 하나씩 열어보세요.';
  render();
}

document.getElementById('resetBtn').addEventListener('click',()=>reset(true));
revealEl.addEventListener('click',()=>{revealEl.classList.remove('show')});

const canvas=document.getElementById('confetti'); const ctx=canvas.getContext('2d');
let pieces=[], anim;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight} addEventListener('resize',resize); resize();
function confettiBurst(colors){
  pieces=[];
  for(let i=0;i<180;i++) pieces.push({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*14,vy:(Math.random()*-12)-3,g:.28+Math.random()*.18,s:6+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:colors[(Math.random()*colors.length)|0],life:120+Math.random()*40});
  cancelAnimationFrame(anim);tick();
}
function tick(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.65);ctx.restore();});
  pieces=pieces.filter(p=>p.life>0&&p.y<innerHeight+40);
  if(pieces.length) anim=requestAnimationFrame(tick); else ctx.clearRect(0,0,canvas.width,canvas.height);
}

initAnalytics();
reset();
</script>
</body>
</html>
